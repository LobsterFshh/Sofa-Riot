function h(tag,props){
  var e=document.createElement(tag);
  if(props){
    Object.keys(props).forEach(function(k){
      var v=props[k];
      if(v===null||v===undefined||v===false) return;
      if(k==='class') e.className=v;
      else if(k==='style') e.style.cssText=v;
      else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
      else if(v===true) e.setAttribute(k,'');
      else e.setAttribute(k,v);
    });
  }
  for(var i=2;i<arguments.length;i++) add(e,arguments[i]);
  return e;
}
function add(e,c){

}

var CONFIGURED=!!(FIREBASE_CONFIG.apiKey&&String(FIREBASE_CONFIG.apiKey).indexOf('YOUR_')!==0&&FIREBASE_CONFIG.databaseURL&&String(FIREBASE_CONFIG.databaseURL).indexOf('YOUR_')<0);
var db=null,room=null,TS=null,ATT=[],connRef=null,connCb=null;
var ME={role:null,code:null,pid:null,name:'',plays:false};
var S={host:null,screen:null,roster:null,rosterKey:'',players:{},done:{},task:null,input:null};
var VIEW='screen';
var CFG={mode:lsGet('mode','party'),rounds:lsGet('rounds',2)};
if(!MODES.some(function(m){return m[0]===CFG.mode})) CFG.mode='party';
if(CFG.rounds!==1&&CFG.rounds!==2&&CFG.rounds!==3) CFG.rounds=2;
var G={players:[],plan:[],rounds:2,mode:'party'};
var E={sid:0,tid:0,press:null,skip:null,gen:0,leaving:false};
var LAST={},mvKey='',lastTaskTid=null;

var app=document.getElementById('app');
var barEl=h('div',{id:'hostbar',hidden:true});
var sv=h('div',{id:'sv',class:'view'});
var mv=h('div',{id:'mv',class:'view',hidden:true});
app.append(barEl,sv,mv);

function myPid(){
  var p=ssGet('pid',null);
  if(!p){p=rid();ssSet('pid',p);}
  return p;
}
function genCode(){
  var c='ABCDEFGHJKLMNPQRSTUVWXYZ',s='';
  for(var i=0;i<4;i++) s+=c.charAt(Math.floor(Math.random()*c.length));
  return s;
}
function baseUrl(){return location.href.split(/[?#]/)[0];}
function inviteUrl(){return baseUrl()+'?room='+ME.code;}

function lobbyList(){
  return Object.keys(S.players).map(function(pid){return Object.assign({pid:pid},S.players[pid]);})
    .sort(function(a,b){return ((a.joined||0)-(b.joined||0))||(a.pid<b.pid?-1:1);});
}
function rosterIdx(pid){
  var r=S.roster||[];
  for(var i=0;i<r.length;i++) if(r[i].pid===pid) return i;
  return -1;
}
function P(i){return (S.roster||[])[i]||{name:'?',ci:0,pid:'',score:0};}
function ciOf(pid){
  var i=rosterIdx(pid);
  if(i>=0) return S.roster[i].ci;
  var l=lobbyList();
  for(var k=0;k<l.length;k++) if(l[k].pid===pid) return k;
  return 0;
}

/* ---------- firebase plumbing ---------- */
function needDb(){
  if(!CONFIGURED) throw new Error('Firebase isn’t set up yet. Paste your config into FIREBASE_CONFIG near the top of the script.');
  if(!db){
    if(typeof firebase==='undefined') throw new Error('Couldn’t load Firebase. Check your connection and reload.');
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.database();
    TS=firebase.database.ServerValue.TIMESTAMP;
  }
  return db;
}
function listen(ref,cb){ref.on('value',cb);ATT.push([ref,cb]);}
function teardown(){
  E.gen++;E.press=null;E.skip=null;
  ATT.forEach(function(a){try{a[0].off('value',a[1]);}catch(e){}});
  ATT=[];
  if(connRef&&connCb){try{connRef.off('value',connCb);}catch(e){}}
  connRef=null;connCb=null;
  if(room&&ME.plays&&ME.pid){try{room.child('players/'+ME.pid+'/online').onDisconnect().cancel();}catch(e){}}
  room=null;
  S={host:null,screen:null,roster:null,rosterKey:'',players:{},done:{},task:null,input:null};
  mvKey='';lastTaskTid=null;LAST={};
}
function saveSession(){ssSet('session',{role:ME.role,code:ME.code,pid:ME.pid,name:ME.name,plays:ME.plays});}

function createRoom(name,plays){
  needDb();
  var pid=myPid(),code,tries=0;
  function claim(){
    code=genCode();
    return db.ref('rooms/'+code+'/host').transaction(function(cur){return cur===null?pid:undefined;}).then(function(r){
      if(r.committed) return null;
      if(++tries>12) throw new Error('Couldn’t make a room. Try again.');
      return claim();
    });
  }
  return claim().then(function(){
    ME={role:'host',code:code,pid:pid,name:name,plays:plays};
    room=db.ref('rooms/'+code);
    return room.child('created').set(TS);
  }).then(function(){
    return plays?room.child('players/'+pid).update({name:name,joined:TS,online:true}):null;
  }).then(enterRoom);
}
function joinRoom(code,name){
  needDb();
  code=String(code||'').toUpperCase().trim();
  if(code.length!==4) return Promise.reject(new Error('Room codes are 4 letters.'));
  var pid=myPid(),r=db.ref('rooms/'+code);
  return Promise.all([r.child('host').once('value'),r.child('players').once('value'),r.child('screen/sid').once('value')]).then(function(res){
    if(!res[0].exists()) throw new Error('No room with that code.');
    var players=res[1].val()||{},existing=players[pid];
    if(!existing){
      if(res[2].exists()) throw new Error('That game has already started.');
      if(Object.keys(players).length>=MAXP) throw new Error('That room is full.');
    }
    ME={role:'player',code:code,pid:pid,name:existing?existing.name:name,plays:true};
    room=r;
    return r.child('players/'+pid).update(existing?{online:true}:{name:name,joined:TS,online:true});
  }).then(enterRoom);
}
function joinDisplay(code){
  needDb();
  code=String(code||'').toUpperCase().trim();
  if(code.length!==4) return Promise.reject(new Error('Room codes are 4 letters.'));
  var r=db.ref('rooms/'+code);
  return r.child('host').once('value').then(function(s){
    if(!s.exists()) throw new Error('No room with that code.');
    ME={role:'display',code:code,pid:rid(),name:'',plays:false};
    room=r;
    enterRoom();
  });
}
function resumeHost(ss){
  needDb();
  var r=db.ref('rooms/'+ss.code);
  return Promise.all([r.child('host').once('value'),r.child('screen/sid').once('value')]).then(function(res){
    if(res[0].val()!==ss.pid) throw new Error('That room is gone.');
    if(res[1].exists()){
      return r.remove().then(function(){throw new Error('The last game was interrupted when the host page reloaded.');});
    }
    ME={role:'host',code:ss.code,pid:ss.pid,name:ss.name,plays:ss.plays};
    room=r;
    enterRoom();
  });
}

function enterRoom(){
  attach();
  saveSession();
  VIEW=ME.role==='player'?'me':'screen';
  applyView();
  renderBar();
  renderScreen(true);
  renderMe(true);
}
function attach(){
  var r=room;
  listen(r.child('host'),function(s){
    S.host=s.val();
    if(s.val()===null&&ME.role&&!E.leaving) showHome('The host ended the game.');
  });
  listen(r.child('screen'),function(s){
    var prev=S.screen;S.screen=s.val();
    if(prev&&S.screen&&prev.sid===S.screen.sid) return;
    renderScreen(true);renderMe(false);
  });
  listen(r.child('roster'),function(s){
    S.roster=s.val();
    var k=S.roster?JSON.stringify(S.roster.map(function(p){return [p.pid,p.name,p.ci];})):'';
    var structural=k!==S.rosterKey;S.rosterKey=k;
    if(structural) renderScreen(false);
    renderMe(false);
  });
  listen(r.child('players'),function(s){
    S.players=s.val()||{};
    if(!S.screen) renderScreen(false);
    renderBar();renderMe(false);
  });
  listen(r.child('done'),function(s){S.done=s.val()||{};updateStatus();});
  if(ME.plays){
    listen(r.child('tasks/'+ME.pid),function(s){S.task=s.val();renderMe(false);renderBar();});
    listen(r.child('inputs/'+ME.pid),function(s){S.input=s.val();renderMe(false);renderBar();});
    connRef=db.ref('.info/connected');
    connCb=function(s){
      if(s.val()===true&&room){
        var pr=room.child('players/'+ME.pid+'/online');
        pr.onDisconnect().set(false);pr.set(true);
      }
    };
    connRef.on('value',connCb);
  }
}

/* ---------- chrome: top bar and view switching ---------- */
function pending(){return !!(S.task&&!(S.input&&S.input.tid===S.task.tid));}
function applyView(){
  sv.hidden=VIEW!=='screen';
  mv.hidden=VIEW!=='me';
  document.documentElement.classList.toggle('tv',VIEW==='screen'&&(ME.role==='host'||ME.role==='display'));
}
function setView(v){
  VIEW=v;applyView();renderBar();
  if(v==='me'){renderMe(true);window.dispatchEvent(new Event('resize'));}
  window.scrollTo(0,0);
}
function renderBar(){
  if(!ME.role){barEl.hidden=true;return;}
  barEl.hidden=false;
  var kids=[h('span',{class:'roomtag num'},'Room '+ME.code)];
  if(ME.role==='host'&&ME.plays){
    var b1=h('button',{type:'button','aria-pressed':String(VIEW==='screen'),onclick:function(){setView('screen');}},'Screen');
    var b2=h('button',{type:'button','aria-pressed':String(VIEW==='me'),onclick:function(){setView('me');}},'My device',(pending()&&VIEW!=='me')?h('span',{class:'badge','aria-label':'Your turn'}):null);
    kids.push(h('div',{class:'seg'},b1,b2));
  } else if(ME.role==='display'){
    kids.push(h('span',null,'Screen only'));
  }
  if(ME.role==='host') kids.push(h('button',{class:'btn alt small',type:'button',onclick:endGame},'End game'));
  else if(ME.role==='display'||(ME.role==='player'&&!S.screen)) kids.push(h('button',{class:'btn alt small',type:'button',onclick:leaveRoom},'Leave'));
  put(barEl,kids);
}
function endGame(){
  if(!confirm('End the game for everyone?')) return;
  E.leaving=true;
  var r=room;
  r.remove().then(function(){E.leaving=false;showHome('Game ended.');}).catch(function(){E.leaving=false;showHome('Game ended.');});
}
function leaveRoom(){
  var r=room,pid=ME.pid,role=ME.role;
  var p=(role==='player'&&r)?r.child('players/'+pid).remove():Promise.resolve();
  p.catch(function(){}).then(function(){showHome();});
}
function fatal(e){
  console.error(e);
  put(sv,h('div',{class:'panel'},h('p',{class:'msg'},'The game hit an error: '+((e&&e.message)||e))),ME.role==='host'?btn('End game',endGame):null);
}

/* ---------- home / forms ---------- */
function showHome(msg){
  teardown();
  ME={role:null,code:null,pid:null,name:'',plays:false};
  ssSet('session',null);
  document.documentElement.classList.remove('tv');
  barEl.hidden=true;mv.hidden=true;sv.hidden=false;
  var q=new URLSearchParams(location.search);
  put(sv,
    h('div',{class:'section pop'},
      h('h1',{class:'logo'},'Sofa',h('span',null,'Riot')),
      h('p',{class:'lede'},'Party games for the whole couch. One device runs the show and everyone plays on their own phone.')),
    msg?h('p',{class:'msg',role:'status'},msg):null,
    !CONFIGURED?h('div',{class:'panel section'},
      h('p',{class:'eyebrow'},'One-time setup'),
      h('p',null,'Paste your Firebase web config into FIREBASE_CONFIG at the top of the script (it needs a Realtime Database URL), then reload.')):null,
    h('div',{class:'section pop',style:'--i:1'},
      btn('Host a game',hostForm),
      btn('Join a game',function(){joinForm(q.get('room')||'');},'alt'),
      h('button',{class:'linkbtn',type:'button',onclick:function(){displayForm(q.get('display')||'');}},'Use this device as the group screen only'))
  );
  window.scrollTo(0,0);
}
function backRow(){return h('button',{class:'linkbtn',type:'button',onclick:function(){showHome();}},'← Back');}
function hostForm(){
  var plays=true;
  var name=h('input',{class:'field',type:'text',maxlength:'14',placeholder:'Your name',value:lsGet('name',''),autocomplete:'off',autocapitalize:'words','aria-label':'Your name'});
  var yes=h('button',{type:'button','aria-pressed':'true'},'I’m playing too');
  var no=h('button',{type:'button','aria-pressed':'false'},'Screen only');
  function setP(v){plays=v;yes.setAttribute('aria-pressed',String(v));no.setAttribute('aria-pressed',String(!v));name.hidden=!v;}
  yes.addEventListener('click',function(){setP(true);});
  no.addEventListener('click',function(){setP(false);});
  var msg=h('p',{class:'msg',role:'status'});
  var go=btn('Create room',function(){
    var n=name.value.trim();
    if(plays&&!n){msg.textContent='Add your name so the others see who you are.';return;}
    go.disabled=true;msg.textContent='';
    if(plays) lsSet('name',n);
    try{
      createRoom(n,plays).catch(function(e){msg.textContent=e.message||String(e);go.disabled=false;});
    }catch(e){msg.textContent=e.message;go.disabled=false;}
  });
  put(sv,bar('Host','New room'),
    h('h2',{class:'display xl pop'},'Host a game'),
    h('p',{class:'lede'},'This device runs the game and shows the shared screen. You can play from it too, or just keep it as the screen.'),
    h('div',{class:'seg'},yes,no),name,msg,go,backRow());
}
function joinForm(prefill){
  var code=h('input',{class:'field code-in',type:'text',maxlength:'4',placeholder:'CODE',value:prefill,autocomplete:'off',autocapitalize:'characters','aria-label':'Room code'});
  var name=h('input',{class:'field',type:'text',maxlength:'14',placeholder:'Your name',value:lsGet('name',''),autocomplete:'off',autocapitalize:'words','aria-label':'Your name'});
  code.addEventListener('input',function(){code.value=code.value.toUpperCase().replace(/[^A-Z]/g,'');});
  var msg=h('p',{class:'msg',role:'status'});
  var go=btn('Join',function(){
    var n=name.value.trim();
    if(code.value.length!==4){msg.textContent='Enter the 4-letter room code.';return;}
    if(!n){msg.textContent='Add your name first.';return;}
    go.disabled=true;msg.textContent='';lsSet('name',n);
    try{
      joinRoom(code.value,n).catch(function(e){msg.textContent=e.message||String(e);go.disabled=false;});
    }catch(e){msg.textContent=e.message;go.disabled=false;}
  });
  put(sv,bar('Join','Enter the code'),
    h('h2',{class:'display xl pop'},'Join a game'),
    h('p',{class:'lede'},'The code is on the host’s screen.'),
    code,name,msg,go,backRow());
}
function displayForm(prefill){
  var code=h('input',{class:'field code-in',type:'text',maxlength:'4',placeholder:'CODE',value:prefill,autocomplete:'off',autocapitalize:'characters','aria-label':'Room code'});
  code.addEventListener('input',function(){code.value=code.value.toUpperCase().replace(/[^A-Z]/g,'');});
  var msg=h('p',{class:'msg',role:'status'});
  var go=btn('Show the screen',function(){
    if(code.value.length!==4){msg.textContent='Enter the 4-letter room code.';return;}
    go.disabled=true;msg.textContent='';
    try{
      joinDisplay(code.value).catch(function(e){msg.textContent=e.message||String(e);go.disabled=false;});
    }catch(e){msg.textContent=e.message;go.disabled=false;}
  });
  put(sv,bar('Screen','Display only'),
    h('h2',{class:'display xl pop'},'Group screen'),
    h('p',{class:'lede'},'Use a TV, laptop or tablet as the big shared display. It only shows things and never needs input.'),
    code,msg,go,backRow());
  if(prefill&&prefill.length===4) go.click();
}

/* ---------- screen view (the shared display) ---------- */
function ctl(s){
  var kids=[];
  if(ME.role==='host'){
    if(s.btns) s.btns.forEach(function(b){kids.push(btn(b.label,function(){pressBtn(s.sid,b.id);},b.alt?'alt':''));});
    if(s.wait) kids.push(btn('Skip waiting for the rest',hostSkip,'alt small'));
  }
  return kids.length?h('div',{class:'ctl'},kids):null;
}
function pressBtn(sid,id){
  if(E.press&&S.screen&&S.screen.sid===sid){var f=E.press;E.press=null;f(id);}
}
function hostSkip(){if(E.skip)E.skip();}
function statusRow(){
  var s=S.screen||{},who=s.who||[];
  return h('div',{id:'status',class:'chips'},who.map(function(pid){
    var i=rosterIdx(pid),p=P(i),ok=S.done[pid],off=S.players[pid]&&S.players[pid].online===false;
    return h('span',{class:'chip'+(ok?' ok':'')+((off&&!ok)?' off':'')},avatar(p.ci,p.name),p.name+(ok?' ✓':off?' (offline)':' …'));
  }));
}
function updateStatus(){
  var el=sv.querySelector('#status');
  if(el&&S.screen) el.replaceWith(statusRow());
}
function questionPanel(q){
  var parts=String(q).split('____'),kids=[];
  parts.forEach(function(t,k){kids.push(t);if(k<parts.length-1)kids.push(h('span',{class:'blank'},' '));});
  return h('div',{class:'panel prompt'},kids);
}
function chips(tally){
  var rows=(tally||[]).map(function(n,i){return {i:i,n:n};}).filter(function(x){return x.n>0;}).sort(function(a,b){return b.n-a.n;});
  if(!rows.length) return h('p',{class:'lede'},'Nobody scored this round.');
  return h('div',{class:'chips'},rows.map(function(x){
    var p=P(x.i);
    return h('span',{class:'chip'},avatar(p.ci,p.name),p.name,' ',h('span',{class:'pts'},'+'+fmt(x.n)));
  }));
}
function namesOf(arr){return (arr||[]).map(function(pi){return P(pi).name;}).join(', ');}
function boardRows(scores){
  return (scores||[]).map(function(sc,i){return {i:i,score:sc};}).sort(function(a,b){return b.score-a.score;});
}
function boardEl(scores,offset){
  var rows=boardRows(scores),max=Math.max(1,rows.length?rows[0].score:1);
  return h('div',{class:'board'},rows.map(function(r,k){
    var p=P(r.i);
    return h('div',{class:'brow pop',style:'--i:'+(k+(offset||1))+';--c:var(--p'+(p.ci%8)+')'},
      h('span',{class:'rank'},k+1),avatar(p.ci,p.name),
      h('div',{class:'line'},
        h('div',{class:'head'},h('span',null,p.name),h('span',{class:'num'},fmt(r.score))),
        h('div',{class:'track'},h('div',{class:'fill',style:'--w:'+Math.max(0,Math.round(r.score/max*100))+'%'}))));
  }));
}
function sdSide(s,other){
  var p=P(s.pi);
  return h('div',{class:'side'+(s.votes>other.votes?' win':'')},
    h('div',{class:'text'},s.text),
    h('div',{class:'who'},avatar(p.ci,p.name),h('b',null,p.name)),
    h('div',{class:'meta'},
      h('span',null,s.votes+(s.votes===1?' vote':' votes')),
      h('span',{class:'pts'},'+'+s.pts),
      s.shutout?h('span',null,'Shutout bonus'):null));
}

/* ---------- drawing pad ---------- */
function makePad(){
  var strokes=[],color='#101826',size=0.012,cur=null,W=0,HH=0;
  var api={onchange:null};
  var canvas=h('canvas',{class:'pad','aria-label':'Drawing canvas'});
  var wrap=h('div',{class:'padwrap'},canvas);
  var ctx=canvas.getContext('2d');

  function paint(s){
    ctx.strokeStyle=s.c;ctx.fillStyle=s.c;ctx.lineWidth=Math.max(1,s.s*W);ctx.lineCap='round';ctx.lineJoin='round';
    var p=s.p;
    if(p.length===1){ctx.beginPath();ctx.arc(p[0][0]*W,p[0][1]*HH,ctx.lineWidth/2,0,Math.PI*2);ctx.fill();return;}
    ctx.beginPath();ctx.moveTo(p[0][0]*W,p[0][1]*HH);
    for(var k=1;k<p.length;k++) ctx.lineTo(p[k][0]*W,p[k][1]*HH);
    ctx.stroke();
  }
  function redraw(){
    ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,HH);
    strokes.forEach(paint);
  }
  function fit(){
    var w=Math.floor(canvas.getBoundingClientRect().width);
    if(!w||w===W) return;
    W=w;HH=Math.round(w*0.75);
    var d=window.devicePixelRatio||1;
    canvas.width=Math.round(W*d);canvas.height=Math.round(HH*d);
    canvas.style.height=HH+'px';
    ctx.setTransform(d,0,0,d,0,0);
    redraw();
  }
  function pt(e){
    var r=canvas.getBoundingClientRect();
    return [Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))];
  }
  function change(){if(api.onchange)api.onchange();}

  canvas.addEventListener('pointerdown',function(e){
    e.preventDefault();
    try{canvas.setPointerCapture(e.pointerId);}catch(err){}
    cur={c:color,s:size,p:[pt(e)]};strokes.push(cur);paint(cur);change();
  });
  canvas.addEventListener('pointermove',function(e){
    if(!cur) return;
    e.preventDefault();
    var a=pt(e),p=cur.p,prev=p[p.length-1];
    p.push(a);
    ctx.strokeStyle=cur.c;ctx.lineWidth=Math.max(1,cur.s*W);ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(prev[0]*W,prev[1]*HH);ctx.lineTo(a[0]*W,a[1]*HH);ctx.stroke();
  });
  function end(){cur=null;}
  canvas.addEventListener('pointerup',end);
  canvas.addEventListener('pointercancel',end);

  var COLS=[['#101826','Black'],['#e63946','Red'],['#ff9f1c','Orange'],['#ffd23f','Yellow'],['#2fb36d','Green'],['#2a7de1','Blue'],['#8e4dd6','Purple'],['#8a5a34','Brown'],['#ffffff','Eraser (white)']];
  var sw=COLS.map(function(c){
    var b=h('button',{class:'sw',type:'button','aria-label':c[1],'aria-pressed':String(c[0]===color),style:'background:'+c[0]});
    b.addEventListener('click',function(){color=c[0];sw.forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});});
    return b;
  });
  var SZ=[['S',0.006],['M',0.012],['L',0.03]];
  var sb=SZ.map(function(s){
    var b=h('button',{type:'button','aria-label':'Brush size '+s[0],'aria-pressed':String(s[1]===size)},s[0]);
    b.addEventListener('click',function(){size=s[1];sb.forEach(function(x){x.setAttribute('aria-pressed',String(x===b));});});
    return b;
  });
  var undo=h('button',{class:'btn alt small',type:'button',onclick:function(){strokes.pop();redraw();change();}},'Undo');
  var clear=h('button',{class:'btn alt small',type:'button',onclick:function(){strokes.length=0;redraw();change();}},'Clear');

  api.root=h('div',{class:'section'},wrap,
    h('div',{class:'tools'},sw),
    h('div',{class:'tools'},h('div',{class:'sizes'},sb),undo,clear));
  api.mount=function(){fit();window.addEventListener('resize',fit);};
  api.destroy=function(){window.removeEventListener('resize',fit);};
  api.hasInk=function(){return strokes.length>0;};
  api.exportImg=function(){
    var c=document.createElement('canvas');c.width=480;c.height=360;
    var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,480,360);
    if(canvas.width>0&&canvas.height>0) x.drawImage(canvas,0,0,480,360);
    return c.toDataURL('image/jpeg',0.6);
  };
  return api;
}

/* ---------- host engine ---------- */
function startGame(){
  var list=lobbyList();
  if(ME.role!=='host'||list.length<MINP||list.length>MAXP||S.screen) return;
  var seen={};
  G.players=list.map(function(p,i){
    var base=(p.name||'').trim()||('Player '+(i+1));
    var name=base,k=2;
    while(seen[name.toLowerCase()]){name=base+' '+k;k++;}
    seen[name.toLowerCase()]=true;
    return {pid:p.pid,name:name,ci:i,score:0};
  });
  G.mode=CFG.mode;G.rounds=CFG.rounds;
  hostRun().catch(fatal);
}
function show_(kind,data,btns){
  var gen=E.gen;
  return new Promise(function(resolve){
    if(typeof btns==='string') btns=[{id:'ok',label:btns}];
    var s={sid:++E.sid,kind:kind,data:data||{},btns:btns||null};
    E.press=btns?function(id){resolve(id);}:null;
    room.update(clean({screen:s,roster:G.players,tasks:null,inputs:null,done:null})).then(function(){
      if(!btns&&gen===E.gen) resolve();
    }).catch(fatal);
  });
}
function ask(kind,data,tasks,validate){
  var gen=E.gen;
  return new Promise(function(resolve){
    var tid=++E.tid,pids=Object.keys(tasks),tmap={},got={},fin=false,lastN=-1;
    pids.forEach(function(pid){tmap[pid]=Object.assign({tid:tid},tasks[pid]);});
    var inRef=room.child('inputs');
    function finish(){
      if(fin) return;
      fin=true;inRef.off('value',cb);E.skip=null;resolve(got);
    }
    var cb=function(snap){
      if(fin) return;
      if(gen!==E.gen){fin=true;inRef.off('value',cb);return;}
      var all=snap.val()||{};
      pids.forEach(function(pid){
        if(Object.prototype.hasOwnProperty.call(got,pid)) return;
        var inp=all[pid];
        if(!inp||inp.tid!==tid) return;
        var err=validate?validate(pid,inp.v):null;
        if(err){
          var u={};
          u['tasks/'+pid]=clean(Object.assign({},tmap[pid],{error:err,nonce:Date.now()}));
          u['inputs/'+pid]=null;
          room.update(u);
          return;
        }
        got[pid]=inp.v;
      });
      var n=Object.keys(got).length;
      if(n!==lastN){
        lastN=n;
        var dm={};Object.keys(got).forEach(function(k){dm[k]=true;});
        room.child('done').set(n?dm:null);
      }
      if(n===pids.length) finish();
    };
    E.skip=finish;
    var s={sid:++E.sid,kind:kind,data:data||{},who:pids,wait:1};
    room.update(clean({screen:s,roster:G.players,tasks:tmap,inputs:null,done:null})).then(function(){
      if(gen===E.gen&&!fin) inRef.on('value',cb);
    }).catch(fatal);
  });
}
function vText(n,max,extra){
  return function(pid,v){
    if(!Array.isArray(v)||v.length<n) return 'Fill in every box.';
    for(var i=0;i<n;i++) if(!String(v[i]||'').trim()) return 'Fill in every box.';
    return extra?extra(pid,v):null;
  };
}
function scoresNow(){return G.players.map(function(p){return p.score;});}
function toLobby(){
  return room.update({screen:null,roster:null,tasks:null,inputs:null,done:null}).catch(fatal);
}

async function hostRun(){
  for(;;){
    G.players.forEach(function(p){p.score=0;});
    G.plan=G.mode==='party'?['showdown','fakeout','doodle','comeback']:[G.mode];
    for(var gi=0;gi<G.plan.length;gi++){
      var key=G.plan[gi];
      await show_('intro',{key:key,idx:gi+1,total:G.plan.length,count:G.players.length},'Start');
      await PLAY[key]();
      if(gi<G.plan.length-1) await show_('standings',{scores:scoresNow(),after:gi+1,total:G.plan.length},'Next game');
    }
    var c=await show_('finale',{scores:scoresNow()},[{id:'again',label:'Rematch, same players'},{id:'lobby',label:'Back to the lobby',alt:true}]);
    if(c==='lobby'){await toLobby();return;}
  }
}

/* Showdown */
async function gShowdown(){
  var ps=G.players,N=ps.length,R=G.rounds,pool=[];
  while(pool.length<N*R) pool=pool.concat(shuffle(SHOWDOWN));
  for(var r=0;r<R;r++){
    var label='Round '+(r+1)+' of '+R;
    var matches=pool.slice(r*N,(r+1)*N).map(function(pr,m){
      return {prompt:pr,a:{pi:m,text:'',votes:0},b:{pi:(m+1)%N,text:'',votes:0}};
    });
    var tasks={};
    ps.forEach(function(p,i){
      tasks[p.pid]={kind:'text',title:'Showdown',sub:label,who:p.name,max:90,area:true,ph:'Type something funny',lock:'Lock it in',
        prompts:[matches[i].prompt,matches[(i+N-1)%N].prompt]};
    });
    var ans=await ask('writing',{game:'Showdown',label:label,head:'Write your answers',sub:'Two prompts each. Check your device.'},tasks,vText(2,90));
    ps.forEach(function(p,i){
      var v=ans[p.pid]||[];
      matches[i].a.text=cleanTxt(v[0],90);
      matches[(i+N-1)%N].b.text=cleanTxt(v[1],90);
    });
    var vt={};
    ps.forEach(function(p,v){
      var items=[];
      matches.forEach(function(m,mi){
        if(m.a.pi!==v&&m.b.pi!==v) items.push({m:mi,prompt:m.prompt,a:m.a.text,b:m.b.text,flip:Math.random()<0.5});
      });
      vt[p.pid]={kind:'duels',title:'Showdown',sub:label,items:items};
    });
    var votes=await ask('voting',{game:'Showdown',label:label,head:'Vote on your device',sub:'Pick the funnier answer in each matchup. Skip your own.',
      showdown:matches.map(function(m){return {prompt:m.prompt,a:m.a.text,b:m.b.text};})},vt);
    ps.forEach(function(p,pi){
      var v=votes[p.pid],seen={};
      (Array.isArray(v)?v:[]).forEach(function(tok){
        var parts=String(tok).split(':'),mi=+parts[0],m=matches[mi];
        if(!m||seen[mi]||m.a.pi===pi||m.b.pi===pi) return;
        if(parts[1]==='a'){m.a.votes++;seen[mi]=1;}
        else if(parts[1]==='b'){m.b.votes++;seen[mi]=1;}
      });
    });
    var voters=N-2,tally=ps.map(function(){return 0;});
    matches.forEach(function(m){
      [m.a,m.b].forEach(function(s){
        s.pts=Math.round(1000*s.votes/voters);
        s.shutout=voters>=2&&s.votes===voters;
        if(s.shutout) s.pts+=500;
        ps[s.pi].score+=s.pts;tally[s.pi]+=s.pts;
      });
    });
    await show_('sd_reveal',{label:label,matches:matches,tally:tally},r+1<R?'Next round':'Finish game');
  }
}

/* Comeback Club */
async function gComeback(){
  var ps=G.players,N=ps.length,R=G.rounds,prompts=shuffle(COMEBACK).slice(0,R);
  for(var r=0;r<R;r++){
    var prompt=prompts[r],label='Round '+(r+1)+' of '+R;
    var tasks={};
    ps.forEach(function(p){
      tasks[p.pid]={kind:'text',title:'Comeback Club',sub:label,who:p.name,max:90,area:true,ph:'Type something funny',lock:'Lock it in',prompts:[prompt]};
    });
    var ans=await ask('writing',{game:'Comeback Club',label:label,head:'Write your answer',sub:'Finish the prompt in secret. Check your device.',prompt:prompt},tasks,vText(1,90));
    var answers=ps.map(function(p,pi){return {pi:pi,text:cleanTxt((ans[p.pid]||[])[0],90)};});
    var order=shuffle(answers.map(function(a,k){return {pi:a.pi,text:a.text,k:k};}));
    var vt={};
    ps.forEach(function(p,pi){
      vt[p.pid]={kind:'pick',title:'Comeback Club',sub:label,prompt:prompt,lock:'Lock in vote',
        options:order.filter(function(a){return a.pi!==pi;}).map(function(a){return {k:a.k,text:a.text};})};
    });
    var picks=await ask('voting',{game:'Comeback Club',label:label,head:'Vote on your device',sub:'Pick your favorite. You can’t pick your own.',prompt:prompt,
      options:order.map(function(a){return a.text;})},vt);
    var votes=answers.map(function(){return 0;});
    ps.forEach(function(p,pi){
      var k=picks[p.pid];
      if(typeof k==='number'&&answers[k]&&answers[k].pi!==pi) votes[k]++;
    });
    var rows=answers.map(function(a,k){
      var n=votes[k],pts=n*100,bonus=false;
      if(N>=3&&n===N-1){pts+=200;bonus=true;}
      return {pi:a.pi,text:a.text,n:n,pts:pts,bonus:bonus};
    }).sort(function(x,y){return y.n-x.n;});
    var tally=ps.map(function(){return 0;});
    rows.forEach(function(x){ps[x.pi].score+=x.pts;tally[x.pi]+=x.pts;});
    await show_('cb_reveal',{label:label,prompt:prompt,rows:rows,tally:tally},r+1<R?'Next round':'Finish game');
  }
}

/* Fakeout */
async function gFakeout(){
  var ps=G.players,R=G.rounds,qs=shuffle(FAKEOUT).slice(0,R);
  for(var r=0;r<R;r++){
    var q=qs[r],label='Round '+(r+1)+' of '+R;
    var real=[q.a].concat(q.alts||[]).map(norm);
    var tasks={};
    ps.forEach(function(p){
      tasks[p.pid]={kind:'text',title:'Fakeout',sub:label,who:p.name,max:40,area:false,blanks:true,ph:'Your fake answer',lock:'Lock it in',prompts:[q.q]};
    });
    var ans=await ask('writing',{game:'Fakeout',label:label,head:'Invent a fake answer',sub:'Fill in the blank so it fools everyone.',q:q.q},tasks,
      vText(1,40,function(pid,v){
        return real.indexOf(norm(v[0]))>=0?'That’s too close to the real answer. Make up a different fake.':null;
      }));
    var merged={};
    ps.forEach(function(p,pi){
      var v=ans[p.pid];
      if(!v||!String(v[0]||'').trim()) return;
      var text=cleanTxt(v[0],40),key=norm(text);
      if(merged[key]) merged[key].authors.push(pi);
      else merged[key]={text:text,authors:[pi],real:false,picks:[]};
    });
    var opts=shuffle([{text:q.a,authors:[],real:true,picks:[]}].concat(Object.keys(merged).map(function(k){return merged[k];})));
    var vt={};
    ps.forEach(function(p,pi){
      var options=[];
      opts.forEach(function(o,k){if(o.authors.indexOf(pi)<0) options.push({k:k,text:o.text});});
      vt[p.pid]={kind:'pick',title:'Fakeout',sub:label,q:q.q,caps:true,lock:'Lock in answer',options:options};
    });
    var picks=await ask('voting',{game:'Fakeout',label:label,head:'Which one is true?',sub:'Pick on your device. Your own fake is hidden from you.',q:q.q,caps:true,
      options:opts.map(function(o){return o.text;})},vt);
    var tally=ps.map(function(){return 0;});
    ps.forEach(function(p,pi){
      var k=picks[p.pid],o=(typeof k==='number')?opts[k]:null;
      if(!o||o.authors.indexOf(pi)>=0) return;
      o.picks.push(pi);
      if(o.real) tally[pi]+=1000;
      else o.authors.forEach(function(a){tally[a]+=500;});
    });
    tally.forEach(function(n,k){ps[k].score+=n;});
    var truth=opts.filter(function(o){return o.real;})[0];
    var lies=opts.filter(function(o){return !o.real;}).sort(function(a,b){return b.picks.length-a.picks.length;});
    await show_('fo_reveal',{label:label,truth:{text:truth.text,picks:truth.picks},
      lies:lies.map(function(o){return {text:o.text,authors:o.authors,picks:o.picks};}),tally:tally},
      r+1<R?'Next question':'Finish game');
  }
}

/* Doodle Dupes */
async function gDoodle(){
  var ps=G.players,N=ps.length;
  var pool=shuffle(DOODLE),mine=pool.slice(0,N),rest=pool.slice(N);
  var tasks={};
  ps.forEach(function(p,i){tasks[p.pid]={kind:'draw',title:'Doodle Dupes',sub:'Everyone draws',who:p.name,prompt:mine[i]};});
  var imgs=await ask('writing',{game:'Doodle Dupes',label:'Everyone draws',head:'Draw your secret prompt',sub:'Your prompt is on your device. Make it guessable.'},tasks);
  var drawings=ps.map(function(p,i){
    return {pi:i,prompt:mine[i],img:safeImg(imgs[p.pid]),options:shuffle([mine[i]].concat(shuffle(rest).slice(0,3))),guesses:[]};
  });
  var gt={};
  ps.forEach(function(p,pi){
    var items=[];
    drawings.forEach(function(d,di){if(d.pi!==pi) items.push({d:di,img:d.img,options:d.options});});
    gt[p.pid]={kind:'guess',title:'Doodle Dupes',sub:'Guess the drawings',items:items};
  });
  var gs=await ask('voting',{game:'Doodle Dupes',label:'Guessing time',head:'Guess the drawings',sub:'Pick what each one is on your device.'},gt);
  var tally=ps.map(function(){return 0;});
  ps.forEach(function(p,pi){
    var v=gs[p.pid],seen={};
    (Array.isArray(v)?v:[]).forEach(function(tok){
      var parts=String(tok).split(':'),di=+parts[0],oi=+parts[1],d=drawings[di];
      if(!d||seen[di]||d.pi===pi||!d.options[oi]) return;
      seen[di]=1;
      var pick=d.options[oi],ok=pick===d.prompt;
      d.guesses.push({pi:pi,pick:pick,ok:ok});
      if(ok){tally[pi]+=500;tally[d.pi]+=250;}
    });
  });
  tally.forEach(function(n,k){ps[k].score+=n;});
  await show_('dd_reveal',{drawings:drawings,tally:tally},'Finish game');
}
var PLAY={showdown:gShowdown,comeback:gComeback,fakeout:gFakeout,doodle:gDoodle};

/* ---------- boot ---------- */
function boot(){
  var q=new URLSearchParams(location.search);
  var ss=ssGet('session',null);
  showHome();
  if(q.get('display')){displayForm(q.get('display'));return;}
  if(q.get('room')&&!ss){joinForm(q.get('room'));return;}
  if(ss&&CONFIGURED){
    var p;
    try{
      if(ss.role==='player') p=joinRoom(ss.code,ss.name);
      else if(ss.role==='display') p=joinDisplay(ss.code);
      else if(ss.role==='host') p=resumeHost(ss);
    }catch(e){p=Promise.reject(e);}
    if(p) p.catch(function(e){showHome(e&&e.message?e.message:'Couldn’t rejoin the room.');});
  }
}
boot();

})();
